	m_sName "Zeus Commander: The Battle for Beauregard (Alpha)"
	m_sAuthor "slavkovsky77"
	m_sDescription "Two AI armies fight for the town of Beauregard on Arland. Each side's commander sends its fireteams by ride and on foot, through cover, with FPV drone teams overhead. Join either side, or watch."
	m_sDetails "Alpha of Zeus Commander Reforger on AI Conflict (Zeus Commander edition). The US and the Soviets start at their main bases; Farm is a Soviet base; Beauregard is neutral and the only objective. Each commander puts everything on Beauregard, storms it, holds it once taken, and calls in a second wave when its attack is down to half. Needs DCO_AI Reforger, Competent AI driving, FPV AI Drones and Realistic Combat Drones."
	m_sAICFLaunchParams "-aicfAICommanderMode BOTH -aicfConstructionAttempts 512 -zcrPlanSeconds 60 -zcrPointGeneral -zcrDrones -zcrOnePoint Beauregard -zcrBaseTo Farm:USSR -zcrNoFIA -zcrArmourVanilla -zcrMoveTurrets -zcrNoCoverLayer -zcrDangerDronesOnly -zcrProjSweep -aicfMaxAgentsPerFaction 50 -aicfCapCountsAll -aicfInfantryDeploySize 4 -aicfMusterSize 4 -aicfMaxBuildersPerFaction 6 -aicfVehicleMinimumRequestAgents 2 -aicfSquadsPerSide 12 -zcrBindMainEffort -zcrAttackPlan -zcrNoAttackHold -aicfArmedRideEvery 0 -zcrRideStayMounted -aicfZcrSecondWave 1 -zcrNoLiveMap -zcrNoCensus"
