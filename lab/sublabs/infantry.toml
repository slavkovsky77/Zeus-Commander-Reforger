# Sub-lab "infantry" - 23 Oct 2026 evening. Martin: "maybe I would like to move to DCO if that's possible - some infantry
# tests that I would like to watch"; "I can imagine these as small sub-lab integration tests" (review note 343). Rifle
# squads only on real Arland ground, the game's own soldier AI against the DCO_AI Reforger mod (Workshop, never copied).
name = "infantry"
title = "Infantry"
question = "Do infantry squads fight well - attackers move through cover and take the position, defenders hold it from cover, few die standing in the open - with the game's AI or with DCO?"
issue = "Martin's infantry list since 20 Oct: soldiers walk across open fields like nothing is happening, don't fight from cover, no bounding (review notes 125, 174, 197, 113, 124, 133, 134); DCO_AI is the Workshop's best-known soldier AI mod"
pass_rule = "on every scenario the candidate loses fewer men than the game's AI for the same result (position taken or held), with more of its fighting from cover and fewer deaths standing in the open; then it goes into a watched match with our commander"
runner = "lab/inftest.py"
minutes = 12
units = 1
scenarios = ["storm-foot", "storm-village", "farm-drones-att", "farm-drones-def", "farm-drones-both", "village-drones-att", "village-drones-def", "village-drones-both"]
variants = ["game", "ours", "dco", "dcoours", "dcopush", "dcopush2", "dcoatt", "dcodef", "dconoad", "game60", "dco60"]
baseline = "game"
candidate = "dco"
score = "10*taken + ussr_lost - us_lost + (us_cover or 0)/10 - (died_open_pct or 0)/20"
higher_is_better = true
keys = ["taken", "taken_s", "us_lost", "ussr_lost", "us_cover", "ussr_cover", "died_standing_pct", "died_open_pct", "fight_m"]
main = "us_lost"
conclusion_at = "23 Oct 21:40 · 18 clean runs (3 a setup and scenario) + 10 first runs"
conclusion = """With DCO on both sides, the defence wins.
- **Position taken:** 2 of 6 with DCO - 5 of 6 with the game's AI, 5 of 6 with our soldier layer.
- **Attackers lost:** 5.0 of 9 on average with DCO - 3.3 with the game's AI, 3.2 with ours. Defenders lose far fewer with DCO.
- **Cover:** on the farm DCO attackers fought from cover 8-41% of the time - the game's AI 0-25%, ours 0-8%.
- **Range:** in the village DCO soldiers opened fire from 54-144 m - the game's AI 35-92 m.
- **Our soldier layer** (hold 60 m from a seen enemy, never stand in danger) changes little: the same results, fights a little further out.
- **Caveat:** one 12-minute storm is close to a coin flip in every setup (each had a run where the whole attack died) - more runs needed; cover and range are the steadier signs.
- **DCO is always on both sides:** its config tunes factions but has no per-faction off switch - attacks then need more men or support.
Next: watch the clean DCO videos, then our commander with DCO in a watched match."""
score_words = "10 points if the attackers take the position, plus each defender killed, minus each attacker lost, plus 1 point per 10% of the attackers' fighting time in cover, minus 1 point per 20% of the dead killed in the open"
baseline_words = "the game's own soldier AI"
candidate_words = "the DCO_AI Reforger mod"

[variant_labels]
game = "Game's AI"
ours = "Game's AI + our soldier layer"
dco = "DCO_AI mod"
dcoours = "DCO + our soldier layer"
dcopush = "DCO, storming squad pushes"
dcopush2 = "DCO, storming side pushes"
dcoatt = "DCO attacks, DCO-min defends"
dcodef = "DCO-min attacks, DCO defends"
dconoad = "DCO, no fire at drones"
game60 = "Game's AI + our hold-back (first runs)"
dco60 = "DCO + our hold-back (first runs)"

[variant_words]
game = "the game's own soldier AI alone"
ours = "the game's AI with our soldier layer as in matches: hold 60 m from a seen enemy instead of closing to 15 m, never standing in danger"
dco = "the DCO_AI Reforger mod from the Workshop on every soldier of both squads (default settings), alone"
dcoours = "DCO on both squads plus our soldier layer: hold 60 m from a seen enemy instead of closing in, never standing in danger (Martin, 23 Oct: 'maybe DCO + our hold-back + something')"
dcopush = "full DCO on both squads; the attacking squad is ordered to storm, so our bridge switches DCO's contact drills (break contact, contact SOP, ambush) and overmatch off for it"
dcopush2 = "as dcopush, and the attackers' side also has DCO's pinned, break-contact, contact-SOP and ambush behaviours off (per-faction settings)"
dcoatt = "full DCO on the attackers; the defenders get DCO turned down (all its behaviour switches off, the game's perception) - as close to the game's AI as DCO allows (it can't be switched off for one side)"
dcodef = "the attackers get DCO turned down; full DCO on the defenders"
dconoad = "DCO on both squads with our small-arms fire at drones off; our drone reactions (down, cover) stay - is the own-side fire next to drones ours or DCO's?"
game60 = "the first runs (19:17-20:20): the game's AI with our 60-m hold-back still on - it is always loaded with our mod"
dco60 = "the first runs (19:30-20:20): DCO with our 60-m hold-back still on"

