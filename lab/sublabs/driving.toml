# Sub-lab "driving" - the first one (23 Oct 2026). Martin: "cars blocking each other is the biggest issue"; "they still
# crash into each other"; "it's one last chance, if it doesn't help I will probably drop vehicles" (review notes 289,
# 303-307). The runner is the driving test track (crewed vehicles shuttling on the game's own maps, no commander).
name = "driving"
title = "Driving"
main = "car_hits"
conclusion_at = "23 Oct 13:30, from 79 night runs and 16 watched matches"
conclusion = """Our vehicle mod alone is the best. On the narrow lane, cars meeting head-on crashed 5 times a run with the game's own driver and 0 times with our mod - its head-on slow-down does it: switch only that rule off and it is 3 again. Ural trucks both ways: 6.5 crashes a run, 1.5 with our mod. None of the Workshop mods adds anything: CRX no gain (and slower), JMVehicleAI 4 crashes, roads preferred 3. The Moss Hill base track lost cars to mines and the Everon base exit to closed gates - not driving. In full matches (16 watched): jams 8 -> 4.8 and long stops 4.8 -> 1.4 a match, but still about 4 crashes between cars a match - the next thing to fix."""
question = "Can AI vehicles get through a narrow lane, a trap and head-on meetings without jams, getting stuck or crashing into each other - and which setup does it best?"
issue = "jams at base exits and traps, vehicles stuck off the road, head-on crashes on narrow roads"
pass_rule = "our mod loses at most 1 car a run where the game's driver alone loses 2 or more, with no more jams; then in watched matches on Arland at most 3 jams, 2 long stops and 1 crash between cars per match (NIGHT.md)"
runner = "lab/drivetest.py"
minutes = 10
units = 6
scenarios = ["headon", "mosshill-conflict", "trucks", "northfarm", "everonexit", "headonblast", "convoyblast", "convoy", "traffic", "apc-headon", "apc-convoyblast", "tank-headon", "ifv-convoyblast"]
variants = ["raw", "default", "moveturrets", "risk", "risk2", "nooncoming", "nospacing", "price", "competent", "crx", "jmvai", "best"]
baseline = "raw"
candidate = "default"
score = "legs - 4*lost - 3*car_hits - jams - 2*(oldest_open_s > 300)"
higher_is_better = true
keys = ["legs", "lost", "car_hits", "jams", "stops", "oncoming", "offroad_pct", "median_leg_s"]

# Plain words for the page (Martin, 23 Oct: "baseline raw, candidate default - this is too abstract").
score_words = "trips made, minus 4 for each lost car, 3 for each crash into another car, 1 for each jam, and 2 if a car is stuck over 5 minutes"
baseline_words = "the game's own driver, with nothing of ours"
candidate_words = "our vehicle mod as it is now"

[variant_labels]
raw = "Game's driver alone"
default = "Our mod (all rules)"
risk = "Our mod v2 (collision forecast)"
risk2 = "Our mod v2.1 (forecast looks 130 m out)"
moveturrets = "Our mod + pushes stuck armour too"
nooncoming = "Our mod, no head-on slow-down"
nospacing = "Our mod, no spacing"
price = "Our mod + roads preferred"
competent = "Our mod + wider turns"
crx = "Our mod + CRX AI mod"
jmvai = "JMVehicleAI mod alone"
best = "Our mod + both route tweaks"

[variant_words]
raw = "nothing of ours: the game drives, gets stuck and crashes the way it does"
default = "cars slow to 15 km/h when meeting head-on, keep distance to the car ahead, stuck cars get pushed back"
risk = "v2: each car forecasts collisions 4 s ahead (24 futures from how the cars really move) and drives at the fastest speed under 10% risk; own soldiers 2%; built 23 Oct night in a separate copy"
risk2 = "v2 with the forecast watching cars up to 130 m away instead of 60 m: at 60 m two cars closing at 100 km/h were seen only 2 s before meeting"
moveturrets = "our mod, and stuck vehicles with turrets get pushed back too (off since 22 Oct, when it went with crashed matches)"
nooncoming = "our mod without the head-on slow-down, to see what that rule is worth"
nospacing = "our mod without keeping distance, to see what that rule is worth"
price = "our mod, plus the route planner prefers roads 10x over fields"
competent = "our mod, plus trucks and APCs plan wider turns (the Competent AI driving mod)"
crx = "our mod, plus the CRX Enfusion AI mod"
jmvai = "the JMVehicleAI driving mod instead of ours"
best = "our mod with roads preferred and wider turns"

