# Sub-lab "driving" - the first one (23 Oct 2026). Martin: "cars blocking each other is the biggest issue"; "they still
# crash into each other"; "it's one last chance, if it doesn't help I will probably drop vehicles" (review notes 289,
# 303-307). The runner is the driving test track (crewed vehicles shuttling on the game's own maps, no commander).
name = "driving"
title = "Driving"
main = "car_hits"
conclusion_at = "23 Oct 22:30 · 79 night runs, 16 watched matches, 20 evening runs"
conclusion = """Our vehicle mod alone is the best.
- **Head-on on the narrow lane:** 5 crashes a run with the game's driver, 0 with our mod (its head-on slow-down - switch only that off and it is 3 again).
- **Trucks both ways:** 6.5 crashes a run -> 1.5.
- **Workshop mods add nothing:** CRX no gain and slower, JMVehicleAI 4 crashes, roads preferred 3.
- **Junctions (evening):** the give-way rule made it worse (a crash in every supply-route run) - off. The junction slow-down (two vehicles heading for the same junction both 20 km/h): 0 crashes in 5 runs, slightly fewer trips - on.
- **A car standing in the lane (22:00):** the head-on rule ignored it (both had to be moving) and a UAZ hit one at 51 km/h - now it reacts; next run 0 crashes.
- **Not driving:** the Moss Hill losses were the world's road mines, the Everon base exit is closed gates.
- **Full matches (16 watched):** jams 8 -> 4.8 and long stops 4.8 -> 1.4 a match - still ~4 crashes between cars a match.
Next: the junction slow-down in watched matches."""
question = "Can AI vehicles get through a narrow lane, a trap and head-on meetings without jams, getting stuck or crashing into each other - and which setup does it best?"
issue = "jams at base exits and traps, vehicles stuck off the road, head-on crashes on narrow roads"
pass_rule = "our mod loses at most 1 car a run where the game's driver alone loses 2 or more, with no more jams; then in watched matches on Arland at most 3 jams, 2 long stops and 1 crash between cars per match (NIGHT.md)"
runner = "lab/drivetest.py"
minutes = 10
units = 6
scenarios = ["headon", "mosshill-conflict", "trucks", "northfarm", "everonexit", "headonblast", "convoyblast", "convoy", "traffic", "supply", "manpower", "apc-headon", "apc-convoyblast", "tank-headon", "ifv-convoyblast"]
variants = ["raw", "default", "moveturrets", "risk", "risk2", "nooncoming", "nocrossing", "nojunction", "nospacing", "price", "competent", "crx", "jmvai", "best"]
baseline = "raw"
candidate = "default"
score = "legs - 4*lost - 3*car_hits - jams - 2*(oldest_open_s > 300)"
higher_is_better = true
keys = ["legs", "lost", "car_hits", "jams", "stops", "oncoming", "offroad_pct", "median_leg_s"]

# Plain words for the page (Martin, 23 Oct: "baseline raw, candidate default - this is too abstract").
score_words = "trips made, minus 4 for each lost car, 3 for each crash into another car, 1 for each jam, and 2 if a car is stuck over 5 minutes"
