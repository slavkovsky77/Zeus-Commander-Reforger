# Sub-lab "farm" - the Farm battle as an integration test (3 Nov, review notes 511 and 515). Rows from lab/farmtest.py.
name = "farm"
question = "Which commander wins the Farm battle - Gemini planning each team's drop point, cover route and wait/go, or our rule commander - and does it lose fewer soldiers getting there?"
issue = "2 Nov, Martin: 'infantry is not choosing the best possible route going through real cover', 'points where soldiers are dropped should be planned by LLM', 'enemies should not be ignored', 'only one side can use it the other one will not use it and we will compare'"
pass_rule = "over 10+ battles from each HQ, Gemini's side loses fewer soldiers than the rule commander from the same HQ and takes Farm at least as often; then Martin watches a Gemini side in the game window and calls it better"
runner = "lab/farmtest.py"
minutes = 20.0
units = 0
scenarios = ["gemini", "rules", "code"]
variants = ["harbour", "south"]
baseline = "harbour"
candidate = "south"
score = "took_pct / 10 + killed - lost"
higher_is_better = true
keys = ["lost", "killed", "took_pct", "held_min", "at_obj_8", "at_obj_12", "route_legs_pct", "expose_pct", "model_calls"]
title = "Farm battle"
main = "lost"
split_average = true
score_words = "10 points for taking Farm, plus the enemy soldiers taken out, minus its own soldiers lost"
baseline_words = "the side whose HQ is the harbour, 1.1 km from Farm"
candidate_words = "the side whose HQ is the south base, 2.1 km from Farm"
history_note = "One dot = one side of one 20-minute battle; the colour is who commanded it, the line its average over its last 5 battles. The other side of every Gemini battle is the rule commander. The HQs are drawn per battle, and the harbour side (1.1 km from Farm) takes it far more often - compare a commander from the same HQ. Battles before 3 Nov 05:00 had Gemini's wait orders not working (0 holds); all are headless and not yet watched by Martin."

[scenario_labels]
gemini = "Gemini commands"
rules = "Rule commander"
code = "Code picks routes (no model)"

[scenario_words]
gemini = "lab/liveplan.py: every 30 s a threat map from the enemies the side knows, hidden drop points and left/centre/right cover routes; every ~2.5 min Gemini picks per team the drop point, route and go/wait/support, and the side's drone teams"
rules = "our rule commander (ZCR) as in the watched battles: AI Conflict's attack orders, the measured approach per HQ"
code = "the same live plans as Gemini's, but the code picks (the lowest-exposure route), no model"

[variant_labels]
harbour = "from the harbour HQ"
south = "from the south HQ"

[[questions]]
key = "lost"
title = "Soldiers lost"
short = "soldiers lost a battle"
better = "lower"
axis = "the side's soldiers killed in the 20-minute battle"
quote = "infantry is not choosing the best possible route going through real cover (2 Nov)"

[[questions]]
key = "killed"
title = "Enemy soldiers taken out"
short = "enemy soldiers a battle"
better = "higher"
axis = "the other side's soldiers killed in the battle"
quote = "and yeah definitely enemies should not be ignored (2 Nov)"

[[questions]]
key = "took_pct"
title = "Took Farm"
short = "% of battles it took Farm"
better = "higher"
axis = "100 when the side took Farm in the battle, else 0 - the line is the share of its last 5 battles"
quote = "that whole test should be based on that like what happens if they battle over one place (2 Nov)"

[[questions]]
key = "at_obj_12"
title = "Soldiers at Farm, minute 12"
short = "soldiers within 300 m of Farm"
better = "higher"
axis = "the side's soldiers within 300 m of Farm at game minute 12"

[[questions]]
key = "route_legs_pct"
title = "Attacks on a planned route"
short = "% of attack legs on a route"
better = "higher"
axis = "the side's attack legs toward Farm that followed a planned cover route - the rest went straight at Farm"
quote = "attack routes are not properly used (2 Nov)"

[[questions]]
key = "expose_pct"
title = "Seen while moving"
short = "% of moving soldiers an enemy saw"
better = "lower"
axis = "of the side's soldiers moving on foot (sampled every 10 s), the share an enemy soldier saw in the last 3 s"

[[questions]]
key = "held_min"
title = "Minutes holding Farm"
short = "game minutes"
better = "higher"
axis = "game minutes the side held Farm in the 20-minute battle"
